spring.application.name=Orchestrator

#database config
spring.datasource.url=${DB_URL}/${DB_NAME}
spring.datasource.username=${PSQL_USERNAME}
spring.datasource.password=${PSQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.xml

#logging
logging.level.liquibase=INFO
logging.level.org.springframework=INFO

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

#transcoder EXE
transcoding.encoder.path=${user.home}/${spring.application.name}/Assets/encoding_tasks


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orchestrator-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081